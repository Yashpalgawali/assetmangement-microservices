server:
  port: 9093

spring:
  application:
    name: designation
  profiles:
    active: "prod"
  datasource:
    username: root
    password: root
#    url: jdbc:mysql://host.docker.internal:3399/designationdb
    url: jdbc:mysql://localhost:3399/assetmanagement_micro_db
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  config:
#    import: "optional:configserver:http://host.docker.internal:8071/"
    import: "optional:configserver:http://localhost:8071/"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

endpoints:
  shutdown:
    enabled: true

logging:
  level:
    com:
      example:
        demo: DEBUG