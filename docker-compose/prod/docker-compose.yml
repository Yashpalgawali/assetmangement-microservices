services:
  rabbit:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      retries: 10
      interval: 10s
      timeout: 10s
      start_period: 10s
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "yashpalgawali/configserver:v1"
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s 
      retries: 15
      start_period: 10s
    depends_on:
      rabbit:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-base-config

  company:
    image: "yashpalgawali/company:v1"
    container_name: "company-ms"
    ports:
      - "9091:9091"
    depends_on:
      configserver:
        required: true
        restart: true
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "company"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  department:
    image: "yashpalgawali/department:v1"
    container_name: "department-ms"
    ports:
      - "9092:9092"
    depends_on:
      configserver:
        condition: service_healthy
        required: true
        restart: true
    environment:
      SPRING_APPLICATION_NAME: "department"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  
  designation:
    image: "yashpalgawali/designation:v1"
    container_name: "designation-ms"
    ports:
      - "9093:9093"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "designation"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  assetmanagement:
    driver: "bridge"