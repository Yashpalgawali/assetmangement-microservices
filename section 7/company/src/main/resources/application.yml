server:
  port: 9091
spring:
  application:
    name: "company"
  profiles:
    active: "prod"
  datasource:
    username: root
    password: root
#    url: jdbc:mysql://host.docker.internal:3399/companydb
#    url: jdbc:mysql://localhost:3306/companydb
    url: jdbc:mysql://localhost:3399/companydb
  sql:
    init:
      mode: always
  jpa:    
    show-sql: true
    hibernate:
      ddl-auto: update    
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true

# Eureka server   
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

# This information can be seen in the Eureka Dashboard
info:
  app:
    name: "company"
    description: "Asset Management Company Application"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true

endpoints:
  shutdown:
    enabled: true

logging:
  level:
    com:
      example:
        demo: DEBUG

resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      permitted-number-of-calls-in-half-open-state: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10000

resilience4j.retry:
  configs:
    default:
      max-attempts: 3 
      wait-duration: 600
      enable-exponential-backoff: true
      exponential-backoff-multiplier: 2
      ignore-exceptions:
        - java.lang.NullPointerException
      retry-exceptions:
        - java.util.concurrent.TimeoutException
