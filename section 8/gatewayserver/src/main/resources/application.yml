server:
  port: 8072
spring:
  application:
    name: gatewayserver
  config:
    import: optional:configserver:http://localhost:8071/
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
      connect-timeout: 2s
  cloud:
    gateway:
      discovery:
        locator:
            enabled: false
            lower-case-service-id: true
      httpclient:
        connect-timeout: 1000
        response-timeout: 10s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:7080/realms/master/protocol/openid-connect/certs"

