server:
  port: 9091
spring:
  application:
    name: "company"
  profiles:
    active: "prod"
  datasource:
    username: root
    password: root
#    url: jdbc:mysql://host.docker.internal:3399/companydb
#    url: jdbc:mysql://localhost:3306/companydb
    url: jdbc:mysql://localhost:3399/companydb
  sql:
    init:
      mode: always
  jpa:    
    show-sql: true
    hibernate:
      ddl-auto: update    
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  config:
#    import: "optional:configserver:http://host.docker.internal:8071/"
    import: "optional:configserver:http://localhost:8071/"

# Eureka server   
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

# This information can be seen in the Eureka Dashboard
info:
  app:
    name: "company"
    description: "Asset Management Company Application"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  info:
    env:
      enabled: true

endpoints:
  shutdown:
    enabled: true