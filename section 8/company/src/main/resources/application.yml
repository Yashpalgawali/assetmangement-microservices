server:
  port: 9091
spring:
  application:
    name: "company"
  profiles:
    active: "prod"
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3399/assetmanagement_micro_db
  sql:
    init:
      mode: always
  jpa:    
    show-sql: true
    hibernate:
      ddl-auto: update    
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
    function:
      definition: updateCommunication
    stream:
      default-binder: kafka
      bindings:
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
        sendCommunication-out-0:
          destination: send-communication
      kafka:
        binder:
          brokers:
          - localhost:9092

# Eureka server   
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

# This information can be seen in the Eureka Dashboard
info:
  app:
    name: "company"
    description: "Asset Management Company Application"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

endpoints:
  shutdown:
    enabled: true

logging:
  level:
    com:
      example:
        demo: DEBUG

resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      permitted-number-of-calls-in-half-open-state: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10000

resilience4j.retry:
  configs:
    default:
      max-attempts: 3 
      wait-duration: 600
      enable-exponential-backoff: true
      exponential-backoff-multiplier: 2
      ignore-exceptions:
        - java.lang.NullPointerException
      retry-exceptions:
        - java.util.concurrent.TimeoutException
