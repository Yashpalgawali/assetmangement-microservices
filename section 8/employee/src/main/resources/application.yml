server:
  port: 9590
spring:
  application:
    name: employee
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3399/assetmanagement_micro_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    username: guest
    password: guest
    port: 5672
    connection-timeout: 10s
  config:
    import: "optional:configserver://localhost:8071"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    prefer-ip-address: true

info:
  name: ${spring.application.name}
  description: "This is the Employee Microservice"
  version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com:
      example:
        demo: DEBUG
