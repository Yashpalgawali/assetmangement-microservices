server:
  port: 9092
spring:
  application:
    name: department
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3399/departmentdb
#    url: jdbc:mysql://localhost:3307/departmentdb
#    url: jdbc:mysql://host.docker.internal:3399/departmentdb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always       
  config:
    import: "optional:configserver:http://localhost:8071/"
#    import: "optional:configserver:http://configserver:8071/"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

#Eureka server config
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "department"
    version: "1.0.0"
    description: "Asset Management Department Service"
  
management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  info:
    env:
      enabled: true
endpoints:
  shutdown:
    enabled: true

logging:
  level:
    com:
      example:
        demo: DEBUG